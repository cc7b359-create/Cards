<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Let's Start from the Beginning</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:'Inter',sans-serif;

background:#F7F3EC;

min-height:100vh;

overflow-x:hidden;

display:flex;
justify-content:center;
align-items:center;

padding:28px;

position:relative;

color:#4a453d;

}

/* Рисовая бумага */

body::before{

content:"";

position:fixed;

inset:0;

pointer-events:none;

opacity:.16;

background-image:

radial-gradient(circle at 20% 20%, rgba(255,255,255,.9) 0 2px, transparent 2px),

radial-gradient(circle at 80% 70%, rgba(255,255,255,.8) 0 2px, transparent 2px),

linear-gradient(90deg,
rgba(255,255,255,.12),
transparent 30%,
rgba(255,255,255,.08) 60%,
transparent);

}

.container{

position:relative;

width:100%;
max-width:760px;

}

.letter{

background:rgba(255,252,247,.96);

border:1px solid rgba(210,186,145,.45);

border-radius:28px;

padding:55px 36px;

box-shadow:

0 18px 60px rgba(0,0,0,.08);

position:relative;

overflow:hidden;

}

.letter::before{

content:"";

position:absolute;

top:0;

left:0;

width:100%;

height:8px;

background:linear-gradient(
90deg,
#D9C08A,
#E9D7A7,
#D9C08A
);

}

.title{

font-family:'Cormorant Garamond',serif;

font-size:56px;

font-weight:600;

text-align:center;

line-height:1.08;

margin-bottom:18px;

color:#2d2b29;

}

.line{

width:90px;

height:2px;

background:#D7B97B;

margin:0 auto 35px;

}

.open-btn{

display:block;

margin:45px auto 0;

padding:16px 34px;

border:none;

border-radius:16px;

background:#CBA96A;

color:white;

font-size:17px;

font-weight:500;

cursor:pointer;

transition:.35s;

}

.open-btn:hover{

transform:translateY(-2px);

background:#B9934F;

}

.content{

display:none;

animation:fade .9s ease;

margin-top:40px;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(25px);

}

to{

opacity:1;

transform:translateY(0);

}

}
  .intro{

text-align:center;

font-size:20px;

line-height:1.9;

color:#6B6256;

font-style:italic;

margin-bottom:42px;

}

.question{

font-size:27px;

line-height:1.7;

text-align:center;

font-weight:500;

color:#2F2C29;

margin-bottom:40px;

font-family:'Cormorant Garamond',serif;

}

.translation-btn{

display:block;

margin:0 auto;

padding:15px 30px;

border:none;

border-radius:14px;

background:#D6B97A;

color:white;

font-size:16px;

cursor:pointer;

transition:.35s;

}

.translation-btn:hover{

background:#C4A15C;

transform:translateY(-2px);

}

.translation{

display:none;

margin-top:28px;

padding:24px;

background:#FCF8F1;

border:1px solid rgba(214,185,122,.35);

border-radius:18px;

line-height:2;

font-size:17px;

animation:fade .8s ease;

}

.wechat{

display:block;

margin:40px auto 0;

width:max-content;

padding:15px 30px;

border-radius:15px;

background:#07C160;

color:white;

text-decoration:none;

font-weight:600;

transition:.35s;

}

.wechat:hover{

transform:translateY(-2px);

filter:brightness(1.05);

}

</style>

</head>

<body>

<div class="container">

<div class="letter">

<h1 class="title">

Let's Start from the Beginning

</h1>

<div class="line"></div>

<button class="open-btn" onclick="openLetter()">

✉️ 打开信件

</button>

<div class="content" id="content">

<div class="intro">

Every story begins somewhere.<br><br>

I'd love to know where yours began.

</div>

<div class="question">

Tell me about three of your happiest childhood memories.

</div>

<button class="translation-btn" onclick="showTranslation()">

🌸 查看中文翻译

</button>

<div class="translation" id="translation">

每个人的故事都有开始。<br><br>

我很想知道你的故事是从哪里开始的。<br><br>

请告诉我三个让你最快乐的童年回忆。

</div>

<a class="wechat" href="#">

💬 继续在微信聊天

</a>

</div>

</div>

</div>
<script>
function openLetter() {
    document.getElementById("content").style.display = "block";
    document.querySelector(".open-btn").style.display = "none";
}

function showTranslation() {
    document.getElementById("translation").style.display = "block";
}

// Падающие лепестки сакуры
for (let i = 0; i < 20; i++) {
    const petal = document.createElement("div");
    petal.className = "petal";
    petal.style.left = Math.random() * 100 + "vw";
    petal.style.animationDuration = (8 + Math.random() * 6) + "s";
    petal.style.animationDelay = (Math.random() * 8) + "s";
    petal.style.opacity = 0.4 + Math.random() * 0.6;
    document.body.appendChild(petal);
}
</script>

<style>
.petal{
position:fixed;
top:-40px;
width:16px;
height:12px;
background:#f6c8d4;
border-radius:70% 30% 70% 30%;
pointer-events:none;
z-index:999;
animation-name:fall;
animation-timing-function:linear;
animation-iteration-count:infinite;
box-shadow:0 0 2px rgba(0,0,0,.05);
}

@keyframes fall{

0%{
transform:translateY(-50px) rotate(0deg);
}

100%{
transform:
translateY(110vh)
translateX(60px)
rotate(360deg);
}

}

@media(max-width:700px){

body{
padding:18px;
}

.letter{
padding:38px 24px;
}

.title{
font-size:42px;
}

.intro{
font-size:18px;
}

.question{
font-size:23px;
}

.open-btn,
.translation-btn,
.wechat{
width:100%;
}

}
</style>

</body>
</html>
